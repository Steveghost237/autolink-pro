server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # HTML : jamais mis en cache — chaque visite récupère la version à jour
    # (les assets JS/CSS ont un hash dans leur nom, ils peuvent être cachés 1 an)
    add_header Cache-Control "no-cache, must-revalidate";

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Anti-scan : les scanners ne doivent jamais recevoir index.html ──
    # Fichiers/dossiers cachés sensibles (.env, .git, .aws, .ssh…)
    location ~* (^|/)\.(env|git|svn|hg|aws|ssh|npmrc|htaccess|htpasswd|bzr|cvs|idea|vscode|DS_Store) {
        return 404;
    }
    # Fichiers serveur/backups/credentials couramment sondés par les bots
    location ~* \.(php|asp|aspx|jsp|cgi|bak|old|save|swp|sql|log|ini|cfg|env|pem|key|crt|sh|py|rb)$ {
        return 404;
    }
    # Noms de fichiers de credentials cloud (service-account.json, gcp-key.json…)
    location ~* (service-account|gcp-|google-|firebase-|application_default_credentials|keyfile|credentials|/sa\.|/key\.) {
        return 404;
    }

    # Cache statique
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router — tout renvoie vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
